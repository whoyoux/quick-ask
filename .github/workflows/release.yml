name: Release

# Pushing a v* tag builds installers for every OS and attaches them to a draft GitHub Release.
# Running it by hand on main with "release" ticked does the same and creates the tag
# v<package.json version> itself. Installed apps update only once the draft is published.
# Running it by hand without "release" only builds the installers; they stay as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Tag v<package.json version> and attach the installers to a draft release (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Apple Silicon runner packages both architectures: nothing is compiled.
          - target: mac
            os: macos-15
          - target: win
            os: windows-2025
          # The runner's glibc does not matter (nothing is compiled or linked here); the floor is
          # set by Electron and the uiohook-napi prebuild (glibc 2.34).
          - target: linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Package
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          # Unsigned until PLAN T5.5: don't let electron-builder pick up any keychain identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: quick-ask-${{ matrix.target }}
          # latest*.yml tell installed apps about the new version; the zips are macOS updates and
          # the blockmaps let electron-updater download only the changed parts.
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.blockmap
            release/*/latest*.yml
          if-no-files-found: error
          # Installers are already compressed.
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag the release
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(node -p 'require("./package.json").version')"
          # A run that failed after tagging leaves the tag without a published release; reuse it.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null)" = false ]; then
            echo "::error::$tag is already released: bump version in package.json first"
            exit 1
          fi
          # Without the tag, publishing the draft would create it and start this workflow again.
          # A tag pushed with GITHUB_TOKEN starts no workflows.
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: quick-ask-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          # upload-artifact keeps the files' version folder (release/<version>/).
          files: dist/**/*
