appId: com.whoyoux.quickask
productName: Quick Ask
directories:
  buildResources: build
  output: release/${version}
# No spaces: GitHub turns them into dots in release asset names.
artifactName: ${name}-${version}-${os}-${arch}.${ext}
files:
  - out/**
  - resources/**
  - package.json
  # SQL migrations, applied at startup from inside app.asar (the snapshots are only for drizzle-kit).
  - drizzle/**/migration.sql
  # uiohook-napi ships its C sources and a prebuild for every OS; keep only the one we package
  # for. ${platform} is the build machine's OS, so build each OS on its own machine (as CI does).
  # Inside node_modules electron-builder applies only exclusions, hence the negated extglob.
  - "!node_modules/uiohook-napi/{libuiohook,src}{,/**}"
  - "!node_modules/uiohook-napi/prebuilds/!(${platform}-${arch}){,/**}"
# uiohook-napi ships N-API prebuilds that work on every Electron version; nothing to compile.
npmRebuild: false
asarUnpack:
  - node_modules/uiohook-napi/**
# Electron's recommended hardening: the packaged binary can't be turned into a plain Node
# runtime or a debug target, and it runs only the app.asar it shipped with (checked against a
# hash on macOS and Windows). `npm run test:smoke` starts the packaged app to catch breakage.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Flipping fuses changes the Electron binary; re-sign it ad hoc so Apple Silicon still runs it.
  resetAdHocDarwinSignature: true

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  # Ad-hoc signature until PLAN T5.5: without any signature macOS calls the download "damaged";
  # with it, it's an app from an unidentified developer. A Developer ID signature replaces
  # this and needs hardenedRuntime: true for notarization (ad hoc, the hardened runtime's
  # library validation would refuse to load Electron's own frameworks).
  identity: '-'
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu bar app: no Dock icon.
    LSUIElement: true
    NSMicrophoneUsageDescription: Quick Ask nagrywa pytanie tylko wtedy, gdy trzymasz klawisz nagrywania.

win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Utility
  # Names the .desktop file after package.json's desktopName, which Electron reports as the
  # window's WM_CLASS / Wayland app_id, so docks and task switchers show the app's icon.
  syncDesktopName: true
  # Required for .deb; package.json's author has no email.
  maintainer: whoyoux <48690153+whoyoux@users.noreply.github.com>
deb:
  # Setting depends replaces electron-builder's defaults, so the first nine repeat them.
  # uiohook-napi also links libX11, libXrandr, libXtst and libXt (libxtst6 is already a default).
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libx11-6
    - libxrandr2
    - libxt6
